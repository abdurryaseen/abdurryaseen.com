<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Yaseen eyes mark">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <linearGradient id="iris2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a2a"/>
      <stop offset="100%" stop-color="#8a0410"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="98" fill="url(#bg)" stroke="#e30613" stroke-width="3"/>

  <!-- Eye left -->
  <g transform="translate(28, 78)">
    <path d="M0,22 C10,0 46,0 56,22 C46,44 10,44 0,22 Z" fill="#f5f5f5"/>
    <circle cx="28" cy="22" r="14" fill="url(#iris2)"/>
    <circle cx="28" cy="22" r="6" fill="#0a0a0a"/>
    <circle cx="23" cy="17" r="3" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Eye right -->
  <g transform="translate(116, 78)">
    <path d="M0,22 C10,0 46,0 56,22 C46,44 10,44 0,22 Z" fill="#f5f5f5"/>
    <circle cx="28" cy="22" r="14" fill="url(#iris2)"/>
    <circle cx="28" cy="22" r="6" fill="#0a0a0a"/>
    <circle cx="23" cy="17" r="3" fill="#ffffff" opacity="0.85"/>
  </g>

  <text x="100" y="155" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif"
        font-weight="900" font-size="26" letter-spacing="2" fill="#f5f5f5">YASEEN</text>
</svg>
