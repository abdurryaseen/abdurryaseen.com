<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" role="img" aria-label="YAS, eyes, N">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#e30613" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e30613" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iris" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a2a"/>
      <stop offset="100%" stop-color="#8a0410"/>
    </linearGradient>
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#e30613" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- ambient glow behind the eyes -->
  <circle cx="320" cy="80" r="110" fill="url(#glow)"/>

  <!-- YAS -->
  <text x="18" y="112" font-family="Arial Black, Helvetica, sans-serif" font-weight="900"
        font-size="108" letter-spacing="2" fill="#f5f5f5" filter="url(#textGlow)">YAS</text>

  <!-- Eye 1 -->
  <g transform="translate(372, 46)">
    <path d="M0,34 C14,4 54,4 68,34 C54,64 14,64 0,34 Z" fill="#f5f5f5"/>
    <circle cx="34" cy="34" r="20" fill="url(#iris)"/>
    <circle cx="34" cy="34" r="9" fill="#0a0a0a"/>
    <circle cx="28" cy="27" r="4" fill="#ffffff" opacity="0.85"/>
    <path d="M0,34 C14,10 54,10 68,34" fill="none" stroke="#0a0a0a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Eye 2 -->
  <g transform="translate(452, 46)">
    <path d="M0,34 C14,4 54,4 68,34 C54,64 14,64 0,34 Z" fill="#f5f5f5"/>
    <circle cx="34" cy="34" r="20" fill="url(#iris)"/>
    <circle cx="34" cy="34" r="9" fill="#0a0a0a"/>
    <circle cx="28" cy="27" r="4" fill="#ffffff" opacity="0.85"/>
    <path d="M0,34 C14,10 54,10 68,34" fill="none" stroke="#0a0a0a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- N -->
  <text x="534" y="112" font-family="Arial Black, Helvetica, sans-serif" font-weight="900"
        font-size="108" letter-spacing="2" fill="#f5f5f5" filter="url(#textGlow)">N</text>
</svg>
